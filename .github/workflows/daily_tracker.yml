name: Daily OSRS GIM XP Tracker

on:
  schedule:
    # Runs every day at 00:00 UTC (Midnight)
    - cron: '37 0 * * *'
  # Allows you to manually trigger the workflow from the GitHub "Actions" tab
  workflow_dispatch:

jobs:
  track-xp:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Gives GitHub Actions permission to push code updates

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Tracker Script
        run: python scraper.py

      - name: Commit and Push Updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gim_xp_log.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated update: GIM XP $(date -u +'%Y-%m-%d')"
          git push
